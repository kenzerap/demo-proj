# Required metadata
sonar.projectKey=demoproj-web
sonar.projectName=demoproj-web
sonar.projectVersion=1.0

# Comma-separated paths to directories with sources (required)
sonar.sources=src

# Language
sonar.language=ts

# Encoding of the source files
sonar.sourceEncoding=UTF-8

# Test coverage report paths
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.dependencyCheck.htmlReportPath=dependency-reports/dependency-check-report.html
sonar.dependencyCheck.jsonReportPath=dependency-reports/dependency-check-report.json