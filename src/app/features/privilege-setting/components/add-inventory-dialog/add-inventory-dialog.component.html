<h2 mat-dialog-title class="demoproj-red-color mb-[2rem]">Add Inventory Stocks</h2>
<mat-dialog-content class="mat-typography">
  <div class="grid gap-[1rem]">
    <nav
      class="demoproj-tabs"
      mat-tab-nav-bar
      [tabPanel]="tabPanel"
      mat-stretch-tabs="false"
      mat-align-tabs="start"
    >
      @for (tab of tabs(); track $index) {
      <a
        mat-tab-link
        (click)="changeTab(tab.code)"
        [active]="tab.code === activeTabCode()"
      >
        {{ tab.value }}
      </a>
      }
    </nav>

    <app-demoproj-table
      *ngIf="activeTabCode() === inventoryTabCode.CodeUploaded"
      [data]="uploadCodeInventories"
      [isPaginatorEnabled]="false"
      [tableColumns]="codeUploadedTableColumns()"
      [isSingleSelect]="true"
      [tableSectionStyle]="{ 'max-height': '15rem' }"
      [selectedItems]="[selectedItem()]"
      (selectedItemsChange)="onSelectedItemsChange($event)"
    >
    </app-demoproj-table>

    <app-demoproj-table
      *ngIf="activeTabCode() === inventoryTabCode.Product"
      [data]="productInventories"
      [isPaginatorEnabled]="false"
      [tableColumns]="productListTableColumns()"
      [isSingleSelect]="true"
      [tableSectionStyle]="{ 'max-height': '15rem' }"
      [selectedItems]="[selectedItem()]"
      (selectedItemsChange)="onSelectedItemsChange($event)"
    >
    </app-demoproj-table>

    <div class="flex flex-col" [formGroup]="addInventoryForm">
      <div class="base-text-color-gray">Quantity *</div>
      <app-demoproj-input formControlName="quantity" [inputType]="'number'">
        <span error *ngIf="quantityControl?.hasError('required')">
          Please input quantity
        </span>
        <span error *ngIf="quantityControl?.hasError('min')">
          Quantity must be a number greater than or equal 0
        </span>
      </app-demoproj-input>
    </div>

    <mat-divider></mat-divider>
  </div>
</mat-dialog-content>
<mat-dialog-actions [align]="'end'" class="dialog-actions">
  <button
    mat-button
    (click)="onCancel()"
    class="base-border base-btn-border-color"
  >
    Cancel
  </button>

  <button mat-button class="demoproj-btn" (click)="onSubmit()">
    <mat-icon>check</mat-icon>
    Add
  </button>
</mat-dialog-actions>

<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
