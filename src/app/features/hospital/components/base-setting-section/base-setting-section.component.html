<mat-card
  class="grid gap-[1rem] p-[1rem]"
  appearance="outlined"
  *ngIf="formGroup"
  [formGroup]="formGroup"
>
  <div class="flex items-center justify-between mb-[1rem]">
    <h3>Hospital setting</h3>

    <mat-slide-toggle
      class="demoproj-slide-toggle mb-[1rem]"
      hideIcon="true"
      formControlName="is_published"
      >Published</mat-slide-toggle
    >
  </div>

  <div class="flex items-center justify-between gap-[1rem]">
    <div class="flex flex-col w-full">
      <div class="base-text-color-gray">Hospital name *</div>
      <app-demoproj-input formControlName="name">
        <span error *ngIf="nameControl?.hasError('required')">
          Please input Hospital name
        </span>
      </app-demoproj-input>
    </div>

    <div class="flex flex-col w-full">
      <div class="base-text-color-gray">Description</div>
      <app-demoproj-input formControlName="description">
      </app-demoproj-input>
    </div>
  </div>
</mat-card>
