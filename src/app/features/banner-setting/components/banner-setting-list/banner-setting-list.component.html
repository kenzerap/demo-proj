<app-demoproj-table
  [data]="
    (selectselectedTargetGroupIds$ | async)?.includes(-1)
      ? (virtualBannerSettings$ | async)!
      : (bannerSettings$ | async)!
  "
  [tableColumns]="tableColumns()"
  [pagination]="pagination$ | async"
  [loading]="
    (loading$ | async)! ||
    (getMissingBannerSettingsLoading$ | async)!
  "
  [noDataMessage]="'No Banner Set'"
  [disableDragDrop]="!(isEditOrderMode$ | async)"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (rowClick)="onRowClick($event)"
  (dragDropChange)="onDragDropChange($event)"
>
  <ng-template #customColumn let-columnCode="columnCode" let-rowData="rowData">
    <ng-container [ngSwitch]="columnCode">
      <ng-container *ngSwitchCase="'bannerNameWithImage'">
        <div class="flex items-center gap-[0.5rem] my-[0.5rem]">
          <img
            class="w-[3.25rem] h-[3.25rem]"
            loading="lazy"
            [src]="encodeImageUrl(rowData.image_data, rowData.image)"
          />
          <div>{{ rowData.banner_name }}</div>
        </div>
      </ng-container>
      <ng-container *ngSwitchCase="'is_published'">
        <mat-slide-toggle
          class="demoproj-slide-toggle"
          hideIcon="true"
          [checked]="rowData.is_published"
          [disabled]="!(isEditOrderMode$ | async)"
          (change)="onToggleChange($event, rowData)"
        ></mat-slide-toggle>
      </ng-container>
      <ng-container *ngSwitchDefault></ng-container>
    </ng-container>
  </ng-template>
</app-demoproj-table>
