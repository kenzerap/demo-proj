<div class="my-[1.5rem] flex items-center justify-between">
  <div>
    <h2 class="m-0">Redeem History</h2>
    <div class="text-[#667185] font-light mt-[0.5rem]">
      Redeem History Data Display Table
    </div>
  </div>
</div>

<div class="flex justify-end mb-[1rem]">
  <button
    mat-button
    class="demoproj-btn"
    *appHasPermissions="[
      {
        feature: featurePermissionCode.CustomerProfile,
        action: actionPermissionCode.CreateEdit
      }
    ]"
    (click)="exportToExcel()"
    [disabled]="exportLoading$ | async"
  >
    <div class="flex items-center justify-center gap-[0.5rem]">
      <svg-export
        [color]="(exportLoading$ | async) ? '#98a2b4' : 'white'"
      ></svg-export>
      Export to excel
    </div>
  </button>
</div>

<app-demoproj-table
  [data]="(redeemHistories$ | async)!"
  [tableColumns]="tableColumns()"
  [pagination]="pagination$ | async"
  [loading]="(loading$ | async)!"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
></app-demoproj-table>
