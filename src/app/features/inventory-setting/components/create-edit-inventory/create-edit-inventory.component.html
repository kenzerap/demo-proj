<div class="grid grid-cols-[1fr_26.5rem] gap-[1rem] pt-[1.5rem]">
  <div>
    <div class="mb-[1.5rem] flex items-center justify-between">
      <div>
        <h2 class="m-0">
          {{ inventoryId() ? 'Edit' : 'Create' }} Inventory Stocks
        </h2>
      </div>

      <button
        mat-button
        type="button"
        class="base-border base-btn-border-color"
        (click)="setFormMode('edit')"
        *ngIf="formMode() === 'view'"
      >
        <div class="flex items-center justify-center gap-[0.5rem]">
          <img src="edit.svg" alt="edit" loading="lazy" />
          Edit
        </div>
      </button>

      <button
        mat-button
        class="demoproj-btn"
        (click)="onSubmit()"
        [disabled]="
          (createLoading$ | async) ||
          (formMode() === 'create' && inventoryStocksSettingForm.invalid)
        "
        *ngIf="formMode() !== 'view'"
      >
        <mat-icon>check</mat-icon>
        Save
      </button>
    </div>

    <div class="grid gap-[1rem]">
      <app-inventory-stocks-setting-section
        [formGroup]="inventoryStocksSettingForm"
        [formMode]="formMode()"
      ></app-inventory-stocks-setting-section>

      <app-upload-code-list-section
        *ngIf="
          inventoryStocksSettingForm.get('inventory_type')?.value ===
          inventoryType.UPLOAD_CODE
        "
        [formGroup]="inventoryStocksSettingForm"
        [formMode]="formMode()"
      ></app-upload-code-list-section>

      <app-product-stock-list-section
        *ngIf="
          inventoryStocksSettingForm.get('inventory_type')?.value ===
          inventoryType.PRODUCT
        "
        [formGroup]="inventoryStocksSettingForm"
        [formMode]="formMode()"
      ></app-product-stock-list-section>
    </div>
  </div>

  <app-inventory-summary></app-inventory-summary>
</div>
