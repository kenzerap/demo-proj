<div class="grid grid-cols-[1fr] gap-[1rem]">
  <div class="my-[1.5rem] flex items-center justify-between">
    <div>
      <h2 class="m-0">{{ fundId() ? 'Edit' : 'Create' }} Fund Type</h2>
    </div>
    <ng-container
      *appHasPermissions="[
        {
          feature: featurePermissionCode.FundType,
          action: actionPermissionCode.CreateEdit
        }
      ]"
    >
      <div class="flex gap-[1rem]">
        <button
          mat-button
          type="button"
          class="base-border base-btn-border-color"
          (click)="setFormMode('edit')"
          *ngIf="formMode() === 'view'"
        >
          <div class="flex items-center justify-center gap-[0.5rem]">
            <img src="edit.svg" alt="edit" loading="lazy" />
            Edit
          </div>
        </button>

        <button
          mat-button
          class="demoproj-btn"
          (click)="onSubmit()"
          [disabled]="loading$ | async"
          *ngIf="formMode() !== 'view'"
        >
          <mat-icon>check</mat-icon>
          Save
        </button>
      </div>
    </ng-container>
  </div>

  <div class="grid gap-[1rem]">
    <app-base-setting-section
      [formGroup]="baseSettingForm"
      [formMode]="formMode()"
    ></app-base-setting-section>

    <app-product-code-section
      [formGroup]="productCodeForm"
      [formMode]="formMode()"
    ></app-product-code-section>

    <app-channel-section
      [formGroup]="channelForm"
      [formMode]="formMode()"
    ></app-channel-section>

    <app-nationality-section
      [formGroup]="nationalityForm"
      [formMode]="formMode()"
    ></app-nationality-section>
  </div>
</div>
