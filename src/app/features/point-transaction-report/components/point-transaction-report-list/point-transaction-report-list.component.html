<div class="my-[1.5rem] flex items-center justify-between gap-[1rem]">
  <app-point-transaction-report-filter></app-point-transaction-report-filter>
  <button
    mat-button
    class="demoproj-btn"
    *appHasPermissions="[
      {
        feature: featurePermissionCode.PointTransactionReport,
        action: actionPermissionCode.Export
      }
    ]"
    (click)="exportToExcel()"
    [disabled]="
      (exportLoading$ | async) ||
      !(filters$ | async) ||
      !hasFilter((filters$ | async)!)
    "
  >
    <div class="flex items-center justify-center gap-[0.5rem]">
      <svg-export></svg-export>
      Export to excel
    </div>
  </button>
</div>
<app-demoproj-table
  class="min-w-full table-auto whitespace-nowrap"
  [data]="(pointTransactionReport$ | async)!"
  [tableColumns]="tableColumns()"
  [pagination]="pagination$ | async"
  [loading]="(listLoading$ | async)!"
  [noDataMessage]="
    !(selectCommonSearch$ | async)
      ? 'Use the filters above to display your report data.'
      : 'No Point Transaction Report found. Please refine your search'
  "
  [searchHighlightText]="(selectSearchHighlightText$ | async) || ''"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
  <ng-template #customColumn let-columnCode="columnCode" let-rowData="rowData">
    <ng-container [ngSwitch]="columnCode">
      <ng-container *ngSwitchCase="'party_id'">
        <a
          class="demoproj-link"
          (click)="
            navigateToCustomerProfile(rowData.party_id);
            $event.stopPropagation()
          "
          style="cursor: pointer; color: #1671d9; text-decoration: underline"
        >
          {{ rowData.party_id }}
        </a>
      </ng-container>
      <ng-container *ngSwitchDefault></ng-container>
    </ng-container>
  </ng-template>
</app-demoproj-table>
