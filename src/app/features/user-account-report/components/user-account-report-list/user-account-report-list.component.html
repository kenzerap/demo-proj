<app-user-account-report-totals></app-user-account-report-totals>
<div class="my-[2.5rem] relative flex items-center justify-center">
  <hr class="w-full border-[#f0f2f5] opacity-20" />
  <img
    src="chart.svg"
    class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#ffffff]"
    loading="lazy"
  />
</div>
<div class="my-[1.5rem] flex items-center justify-between gap-[1rem]">
  <app-user-account-report-filter></app-user-account-report-filter>
  <button
    mat-button
    class="demoproj-btn"
    *appHasPermissions="[
      {
        feature: featurePermissionCode.PrivilegeUsageReport,
        action: actionPermissionCode.Export,
      },
    ]"
    [disabled]="
      (exportLoading$ | async) ||
      !(filters$ | async) ||
      !hasFilter((filters$ | async)!)
    "
    (click)="exportToExcel()"
  >
    <div class="flex items-center justify-center gap-[0.5rem]">
      <svg-export></svg-export>
      Export to excel
    </div>
  </button>
</div>
<app-demoproj-table
  class="min-w-full table-auto whitespace-nowrap"
  [data]="(userAccountReport$ | async)!"
  [tableColumns]="tableColumns()"
  [pagination]="pagination$ | async"
  [loading]="(listLoading$ | async)!"
  [noDataMessage]="
    !(selectCommonSearch$ | async)
      ? 'Use the filters above to display your report data.'
      : 'No User Account Report found. Please refine your search'
  "
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
>
  <ng-template #customColumn let-columnCode="columnCode" let-rowData="rowData">
    <ng-container [ngSwitch]="columnCode">
      <ng-container *ngSwitchCase="'party_id'">
        <a
          class="demoproj-link"
          (click)="
            navigateToCustomerProfile(rowData.party_id);
            $event.stopPropagation()
          "
          style="cursor: pointer; color: #1671d9; text-decoration: underline"
        >
          <span>{{ rowData.party_id }}</span>
        </a>
      </ng-container>

      <ng-container *ngSwitchCase="'user_type'">
        <span>{{ getCleanUserType(rowData.user_type) }}</span>
      </ng-container>

      <ng-container *ngSwitchCase="'tier'">
        <span>{{ rowData.tier || 'N/A' }}</span>
      </ng-container>

      <ng-container *ngSwitchCase="'individual_policy'">
        <span>{{ rowData.individual_policy ? 1 : 0 }}</span>
      </ng-container>

      <ng-container *ngSwitchCase="'group_policy'">
        <span>{{ rowData.group_policy ? 1 : 0 }}</span>
      </ng-container>

      <ng-container *ngSwitchDefault></ng-container>
    </ng-container>
  </ng-template>
</app-demoproj-table>
