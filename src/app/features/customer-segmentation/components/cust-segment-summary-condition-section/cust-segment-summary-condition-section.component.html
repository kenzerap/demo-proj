<div class="grid gap-[1rem] justify-center my-[1rem]">
  <div class="flex">
    <div class="flex-2 pr-[1rem]">
      <h4 class="text-center">
        Total Customer
      </h4>
      <h5 class="text-center">{{ (segmentSummaryUsers$ | async)?.num_of_users || 0 | number : '1.0-2' }}</h5>
    </div>
    <mat-divider class="base-border base-btn-border-color"></mat-divider>
    <div class="flex-2 pl-[1rem]">
      <h4 class="text-center">
        Total Target
      </h4>
      <h5 class="text-center"> {{ (segmentSummaryUsers$ | async)?.num_of_users || 0 | number : '1.0-2' }}</h5>
    </div>
  </div>
  <div class="flex justify-center">
    <div class="progress-container">
      <mat-progress-spinner
        [diameter]="100"
        [mode]="'determinate'"
        [value]="
          (((segmentSummaryUsers$ | async)?.num_of_user_percentages || 0) *
            80) /
          100
        "
        strokeWidth="13"
        class="progress-circle demoproj-spinner z-[1]"
      ></mat-progress-spinner>
      <svg-defective-thin-circle
        class="background-circle"
        [width]="92"
        [height]="90"
      ></svg-defective-thin-circle>

      <div class="progress-icon">
        <div class="circle-icon">
          <svg-default-user [width]="23" [height]="23"></svg-default-user>
        </div>
      </div>
      <div class="progress-text">
        <span class="text-[0.8rem]"
          >{{
            (segmentSummaryUsers$ | async)?.num_of_user_percentages || 0
          }}%</span
        >
      </div>
    </div>
  </div>
</div>
