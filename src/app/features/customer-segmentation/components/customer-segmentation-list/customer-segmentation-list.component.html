<div class="grid grid-cols-[1fr] gap-[1rem]">
  <div class="my-[1.5rem] flex items-center justify-end gap-[1rem]">
    <ng-container
      *appHasPermissions="[
        {
          feature: featurePermissionCode.CustomerSegmentation,
          action: actionPermissionCode.CreateEdit
        }
      ]"
    >
      <button
        *ngIf="!isEditOrder()"
        mat-button
        class="base-border base-btn-border-color"
        [disabled]="(customerSegmentations$ | async)?.length === 0"
        (click)="setEditOrder(true)"
      >
        <div class="flex items-center justify-center gap-[0.5rem]">
          <img src="edit.svg" alt="edit" [attr.loading]="'lazy'" />
          Edit
        </div>
      </button>

      <button
        *ngIf="!isEditOrder()"
        mat-button
        class="demoproj-btn"
        (click)="createCustomerSegment()"
      >
        <div class="flex items-center justify-center gap-[0.5rem]">
          <svg-plus></svg-plus>
          New Segmentation
        </div>
      </button>
    </ng-container>

    <ng-container *ngIf="isEditOrder()">
      <button
        mat-button
        class="base-border base-btn-border-color"
        (click)="cancelEditOrder()"
      >
        Cancel
      </button>

      <button
        mat-button
        class="demoproj-btn"
        (click)="publishItems()"
        [disabled]="reOrderLoading$ | async"
      >
        <mat-icon>check</mat-icon>
        Publish
      </button>
    </ng-container>
  </div>

  <app-demoproj-table
    [data]="(customerSegmentations$ | async)!"
    [tableColumns]="tableColumns()"
    [pagination]="pagination$ | async"
    [loading]="
      (loading$ | async)! || (getMissingCustomerSegmentationsLoading$ | async)!
    "
    [noDataMessage]="'No Segmentation Set'"
    [disableDragDrop]="!isEditOrder()"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
    (dragDropChange)="onDragDropChange($event)"
    (rowClick)="onRowClick($event)"
  >
    <ng-template
      #customColumn
      let-columnCode="columnCode"
      let-rowData="rowData"
    >
      <ng-container [ngSwitch]="columnCode">
        <ng-container *ngSwitchCase="'status'">
          <mat-slide-toggle
            class="demoproj-slide-toggle"
            hideIcon="true"
            [checked]="rowData.is_published"
            [disabled]="!isEditOrder()"
            (change)="onToggleChange($event, rowData)"
          ></mat-slide-toggle>
        </ng-container>
        <ng-container *ngSwitchDefault></ng-container>
      </ng-container>
    </ng-template>
  </app-demoproj-table>
</div>
