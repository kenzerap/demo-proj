<div class="grid gap-[1rem] justify-center my-[1rem]">
  <h2 class="text-center">
    Total Target:
    {{ (targetGroupUserSummary$ | async)?.count | number : '1.0-2' }}
  </h2>
  <div class="flex justify-center">
    <div class="progress-container">
      <mat-progress-spinner
        [diameter]="100"
        [mode]="'determinate'"
        [value]="
          (((targetGroupUserSummary$ | async)?.percentage || 0) * 80) / 100
        "
        strokeWidth="13"
        class="progress-circle demoproj-spinner z-[1]"
      ></mat-progress-spinner>
      <svg-defective-thin-circle
        class="background-circle"
        [width]="92"
        [height]="90"
      ></svg-defective-thin-circle>

      <div class="progress-icon">
        <div class="circle-icon">
          <svg-default-user [width]="23" [height]="23"></svg-default-user>
        </div>
      </div>
      <div class="progress-text">
        <span class="text-[0.8rem]"
          >{{ (targetGroupUserSummary$ | async)?.percentage || 0 }}%</span
        >
      </div>
    </div>
  </div>
  <h2 class="text-center mb-[0rem]">Preview Mobile App DEMOPROJ</h2>
</div>
<div class="sticky top-[-2rem]">
  <svg-mobile-notification class="justify-center">
    <div class="grid gap-[0.5rem]" notification-popup>
      <div class="flex items-center gap-[0.5rem]">
        <img src="logo-mini.png" alt="search" loading="lazy" />
        <h3 class="m-0 demoproj-red-color">DEMOPROJ</h3>
      </div>

      <div class="font-bold text-[14px]">
        {{ (previewMessage$ | async)?.title }}
      </div>
      <div
        class="text-[14px]"
        [innerHTML]="(previewMessage$ | async)?.body"
      ></div>
    </div>
  </svg-mobile-notification>
</div>
