<form class="grid grid-cols-[auto_auto_auto_6rem_5rem] gap-4 items-center" [formGroup]="searchForm">
    <mat-form-field class="demoproj-select">
        <mat-label>Privilege Status</mat-label>
        <mat-select formControlName="is_published" class="demoproj-select">
            @for (item of privilegeStatusLists; track item) {
            <mat-option [value]="item">{{item}}</mat-option>
            }
        </mat-select>
        <mat-icon class="absolute right-0">keyboard_arrow_down</mat-icon>

    </mat-form-field>
    <mat-form-field class="demoproj-input">
        <mat-label>Start Date</mat-label>
        <span matPrefix>
            <img src="icon-search.svg" alt="search" loading="lazy" />
        </span>
        <mat-date-range-input [rangePicker]="picker1">
            <input matStartDate placeholder="From" formControlName="start_date_time_from" />
            <input matEndDate placeholder="To" formControlName="start_date_time_to" />
        </mat-date-range-input>
        <mat-datepicker-toggle matTextSuffix [for]="picker1">
            <svg-calendar matDatepickerToggleIcon></svg-calendar>
        </mat-datepicker-toggle>
        <mat-date-range-picker #picker1></mat-date-range-picker>
    </mat-form-field>
    <mat-form-field class="demoproj-input">
        <mat-label>End Date</mat-label>
        <span matPrefix>
            <img src="icon-search.svg" alt="search" loading="lazy" />
        </span>
        <mat-date-range-input [rangePicker]="picker2">
            <input matStartDate placeholder="From" formControlName="end_date_time_from" />
            <input matEndDate placeholder="To" formControlName="end_date_time_to" />
        </mat-date-range-input>
        <mat-datepicker-toggle matTextSuffix [for]="picker2">
            <svg-calendar matDatepickerToggleIcon></svg-calendar>
        </mat-datepicker-toggle>
        <mat-date-range-picker #picker2></mat-date-range-picker>
    </mat-form-field>
    <button mat-button class="demoproj-btn" (click)="onSearch()"   [disabled]="!hasFilter(searchForm.value)"
    >
        <mat-icon>search</mat-icon>
        Search
    </button>
    <button mat-button class="base-border" [disabled]="(listLoading$ | async)!" (click)="resetForm()">Clear</button>
</form>
