<div class="grid grid-cols-[1fr] gap-[1rem]">
  <div class="my-[1.5rem] flex items-center justify-between">
    <div>
      <h2 class="m-0">
        {{ splashScreenId() ? 'Edit' : 'Create' }} Splash Screen
      </h2>
    </div>

    <button
      mat-button
      type="button"
      class="base-border base-btn-border-color"
      (click)="setFormMode('edit')"
      *ngIf="formMode() === 'view'"
    >
      <div class="flex items-center justify-center gap-[0.5rem]">
        <img src="edit.svg" alt="edit" loading="lazy" />
        Edit
      </div>
    </button>

    <button
      mat-button
      class="demoproj-btn"
      (click)="onSubmit()"
      [disabled]="(createLoading$ | async) || (updateLoading$ | async)"
      *ngIf="formMode() !== 'view'"
    >
      <mat-icon>check</mat-icon>
      Save
    </button>
  </div>

  <div class="grid gap-[1rem]">
    <app-base-setting-section
      [formGroup]="baseSettingForm"
      [formMode]="formMode()"
      [splashScreenDetail]="(splashScreenDetail$ | async)!"
    ></app-base-setting-section>
  </div>
</div>
